{% extends 'base.html' %}

{% load json_dumps %}

{% block title %}
    Dashboard Meet Je Stad
{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-md-1"></div>
        <div class="col-md-11"><h1>Dashboard Meet Je Stad</h1></div>
    </div>
    <div id="sensors" data-sensors="{{ sensorIds }}"></div>
    {% for index, sensor in sensors %}
        <div id="sensor-{{ sensor.id }}-timestamp" data-timestamp="{% json_dumps sensor.timestamp %}"></div>
        <div id="sensor-{{ sensor.id }}-longitude" data-longitude="{% json_dumps sensor.longitude %}"></div>
        <div id="sensor-{{ sensor.id }}-latitude" data-latitude="{% json_dumps sensor.latitude %}"></div>
        <div id="sensor-{{ sensor.id }}-temperature" data-temperature="{% json_dumps sensor.temperature %}"></div>
        <div id="sensor-{{ sensor.id }}-humidity" data-humidity="{% json_dumps sensor.humidity %}"></div>
        <div id="sensor-{{ sensor.id }}-pm25" data-pm25="{% json_dumps sensor.pm25 %}"></div>
        <div id="sensor-{{ sensor.id }}-pm10" data-pm10="{% json_dumps sensor.pm10 %}"></div>
    {% endfor %}
    <div class="row">
        <div class="col-md-1"></div>
        <div class="col-md-5">
            <div id="map" class="map">
                <div id="popup"></div>
            </div>
        </div>
        <div class="col-md-5">
            <form action="" method="get">
                <div class="row">
                    <div class="col-md-2"><label for="sensor">Sensor</label></div>
                    <div class="col-md-1">
                        <select name="sensor" id="sensor" class="form-select">
                            <option value="">kies sensor</option>
                            {% for index, sensor in sensors %}
                                <option value="{{ index }}">{{ index }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                {% include "graph.html" %}
                <div class="row">
                    <div class="col-md-2"><label for="pm">Alleen fijnstof</label></div>
                    <div class="col-md-1">
                        {% if pm == 'on' %}
                            <input type="checkbox" name="pm" id="pm" class="form-check" checked>
                        {% else %}
                            <input type="checkbox" name="pm" id="pm" class="form-check">
                        {% endif %}
                    </div>
                </div>
                <input type="submit" value="Bereken" class="btn btn-success">
            </form>
        </div>
    </div>
{% endblock %}
