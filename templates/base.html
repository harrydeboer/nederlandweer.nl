<!DOCTYPE html>
<html lang="en">
{% load mtime %}
<head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" sizes="180x180" href="{% mtime 'img/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" href="{% mtime 'img/favicon-32x32.png' %}" sizes="32x32">
    <link rel="icon" type="image/png" href="{% mtime 'img/favicon-16x16.png' %}" sizes="16x16">
    <link rel="manifest" href="{% mtime 'img/site.webmanifest' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.min.css">
    <link rel="stylesheet" href="{% mtime 'css/app.css' %}">
</head>
<body>
{% block content %}
{% endblock %}
<script src="https://code.jquery.com/jquery-3.6.3.min.js"
        integrity="sha256-pvPw+upLPUjgMXY0G+8O0xUf+/Im1MZjXxxgOcBQBXU="
        crossorigin="anonymous"></script>
<script src="{% mtime 'dist/fallback_jquery.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/ol@v10.6.1/dist/ol.min.js"></script>
<script src="{% mtime 'dist/fallback_ol.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
<script src="{% mtime 'dist/fallback_bootstrap.min.js' %}"></script>
<script src="{% mtime 'dist/app.min.js' %}"></script>
</body>
</html>
