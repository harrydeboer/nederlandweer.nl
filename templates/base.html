<!DOCTYPE html>
<html lang="en">
{% load mtime %}
<head>
    <title>{% block title %}{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" sizes="180x180" href="{% mtime 'img/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" href="{% mtime 'img/favicon-32x32.png' %}" sizes="32x32">
    <link rel="icon" type="image/png" href="{% mtime 'img/favicon-16x16.png' %}" sizes="16x16">
    <link rel="manifest" href="{% mtime 'img/site.webmanifest' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v10.6.1/ol.min.css">
    <link rel="stylesheet" href="{% mtime 'css/app.css' %}">
</head>
<body>
{% block nav %}
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbar_supported_content"
                    aria-controls="navbar_supported_content"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbar_supported_content">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li><a href="{% url 'home' %}" class="pageLink">Home</a></li>
                    <li><a href="{% url 'login' %}" class="pageLink"><img src="{% mtime 'img/person-blue.png' %}"
                                                               alt="person" class="user-logo"
                                                               width="22"></a></li>
                </ul>
            </div>
        </div>
    </nav>
{% endblock %}
<div class="container">
    {% block content %}
    {% endblock %}
</div>
<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
<script src="{% mtime 'dist/fallback_jquery.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/ol@v10.7.0/dist/ol.js"></script>
<script src="{% mtime 'dist/fallback_ol.min.js' %}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="{% mtime 'dist/fallback_bootstrap.min.js' %}"></script>
<script src="{% mtime 'dist/dashboard.min.js' %}" defer></script>
<script src="{% mtime 'dist/app.min.js' %}" defer></script>
</body>
</html>
